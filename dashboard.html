<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Scholarly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <h1 class="topbar-brand">Scholarly</h1>
        <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">Log Out</button>
    </header>

    <main class="dashboard">

        <!-- STUDENT PROFILE (sample data for now, Supabase fills this in later) -->
        <section class="card panel profile">
            <div class="avatar" id="student-initials">AM</div>

            <div class="profile-info">
                <h2 id="student-name">Ama Mensah</h2>
                <p id="student-school">UPSA</p>
                <p id="student-programme">Actuarial Science, Level 300</p>
            </div>
        </section>

    </main>

</body>
</html>
