<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Scholarly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <header class="site-header">
        <h1>Scholarly</h1>
        <p>Show up. Stay consistent.</p>
    </header>

    <main>
        <div class="card auth-card">
            <h2>Set a new password</h2>
            <p>Choose a new password for your account.</p>

            <form id="reset-password-form">
                <div class="field">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" name="new-password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                </div>

                <div class="field">
                    <label for="confirm-new-password">Confirm new password</label>
                    <input type="password" id="confirm-new-password" name="confirm-new-password" placeholder="Type it again" minlength="8" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>

            <p><a href="login.html">Back to log in</a></p>
        </div>
    </main>

</body>
</html>
