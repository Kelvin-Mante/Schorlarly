<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarly â€” Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="logo">&#127891; Scholarly</div>
  <div class="subtitle">Create your account</div>

  <form id="signupForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign Up</button>
  </form>

  <div class="message" id="message"></div>

  <div class="toggle">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
