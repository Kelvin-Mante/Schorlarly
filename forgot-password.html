<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarly — Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="logo">&#127891; Scholarly</div>
    <div class="subtitle">We’ll email you a password reset link</div>
    <form id="forgotPasswordForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Send Reset Link</button>
    </form>
    <div class="message" id="message"></div>
    <div class="toggle"><a href="login.html">Back to log in</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
